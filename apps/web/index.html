<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="IndEV — EV route planner for India with live Statiq charger data." />
    <title>IndEV — EV Route Planner for India</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000000'/%3E%3Cpath d='M16 4C10.5 4 7 7.6 7 12.5V26a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V12.5C25 7.6 21.5 4 16 4Z' fill='%23F5F5F2'/%3E%3Cpath d='M16 4C10.5 4 7 7.6 7 12.5h18C25 7.6 21.5 4 16 4Z' fill='%23FFC72C'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <script>
      // The opening sequence plays once per tab session, never under reduced motion.
      try {
        if (!sessionStorage.getItem('indeev-booted') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('boot-on');
        }
      } catch (e) {}
    </script>
    <div class="boot" aria-hidden="true">
      <div class="boot-inner">
        <span class="boot-mark"><svg viewBox="0 0 26 34" aria-hidden="true"><path d="M13 0C5.8 0 0 5.8 0 13v18a3 3 0 0 0 3 3h20a3 3 0 0 0 3-3V13C26 5.8 20.2 0 13 0Z" fill="#f5f5f2"/><path class="cap" fill="#f5f5f2" d="M13 0C5.8 0 0 5.8 0 13h26C26 5.8 20.2 0 13 0Z"/><rect x="7" y="20" width="12" height="2.4" rx="1.2" fill="#000"/><rect x="9" y="25" width="8" height="2.4" rx="1.2" fill="#000"/></svg></span>
        <span class="boot-word"><span style="--i:0">I</span><span style="--i:1">n</span><span style="--i:2">d</span><span style="--i:3">E</span><span style="--i:4">V</span></span>
      </div>
    </div>
    <div id="app">
      <div id="map" aria-label="Route map"></div>

      <!-- top-right floating cluster over the map: mode provenance + trips -->
      <div class="top-cluster">
        <span id="health-badge" class="status-pill hidden" role="status"></span>
        <button id="trips-button" class="chip-btn" type="button" aria-controls="trips-drawer" aria-expanded="false">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
            <path d="M2.5 3.5h8.2c.6 0 1.1.4 1.3 1l1.4 4.2c.1.2.1.4.1.6v2.7a.7.7 0 0 1-.7.7h-.9a2 2 0 0 1-3.9 0H6a2 2 0 0 1-3.9 0H1.2a.7.7 0 0 1-.7-.7V4.2c0-.4.3-.7.7-.7Z" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <circle cx="4.1" cy="12.6" r="1.3" fill="currentColor"/>
            <circle cx="11.9" cy="12.6" r="1.3" fill="currentColor"/>
          </svg>
          Saved trips
        </button>
      </div>

      <aside
        id="planner-panel"
        class="panel"
        role="dialog"
        aria-label="Trip planner"
      ></aside>
      <button id="sheet-open" class="sheet-fab hidden" type="button" aria-label="Open trip planner" aria-expanded="false">Plan a route</button>
      <aside id="trips-drawer" class="trips-panel hidden" aria-label="Saved trips"></aside>
      <div id="toast-root" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
